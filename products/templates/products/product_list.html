<!DOCTYPE html>
<html>
<head>
    <title>Campus Store</title>
</head>
<body>

    <h1>Campus Store</h1>

    {% for product in products %}
        <div>
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <p>Price: ₹{{ product.price }}</p>
        </div>
    {% endfor %}

</body>
</html>
